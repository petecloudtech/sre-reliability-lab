name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Reproduce published simulation
        shell: bash
        run: |
          python slo.py demo --output-dir "$RUNNER_TEMP/sre-lab-example"
          cmp example/incident_requests.csv "$RUNNER_TEMP/sre-lab-example/incident_requests.csv"
          cmp example/incident_report.json "$RUNNER_TEMP/sre-lab-example/incident_report.json"
          python slo.py analyze "$RUNNER_TEMP/sre-lab-example/incident_requests.csv" > "$RUNNER_TEMP/sre-lab-analysis.json"
          cmp example/incident_report.json "$RUNNER_TEMP/sre-lab-analysis.json"
